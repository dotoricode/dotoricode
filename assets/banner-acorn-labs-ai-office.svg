<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">acorn-labs AI office banner</title>
  <desc id="desc">A warm dark interface showing an AI office control room with agents, skills, memory, cron, wiki, logs, and verification panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.55" stop-color="#1F2937"/>
      <stop offset="1" stop-color="#312E1F"/>
    </linearGradient>
    <linearGradient id="card" x1="180" y1="94" x2="1420" y2="462" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172033" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="accent" x1="310" y1="135" x2="1290" y2="135" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="0.52" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="shadow" x="120" y="40" width="1360" height="470" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>
  <circle cx="1330" cy="110" r="240" fill="#F59E0B" fill-opacity="0.10"/>
  <circle cx="250" cy="430" r="260" fill="#22C55E" fill-opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="150" y="64" width="1300" height="392" rx="34" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <rect x="150" y="64" width="1300" height="70" rx="34" fill="#0B1220" fill-opacity="0.88"/>
    <path d="M150 134H1450" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="203" cy="99" r="10" fill="#EF4444"/>
    <circle cx="235" cy="99" r="10" fill="#F59E0B"/>
    <circle cx="267" cy="99" r="10" fill="#22C55E"/>
    <rect x="310" y="91" width="980" height="16" rx="8" fill="url(#accent)" fill-opacity="0.78"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="210" y="207" fill="#FDE68A" font-size="26" font-weight="700" letter-spacing="0.16em">ACORN-LABS</text>
    <text x="210" y="268" fill="#F8FAFC" font-size="62" font-weight="800" letter-spacing="-0.045em">AI office systems</text>
    <text x="212" y="314" fill="#CBD5E1" font-size="24" font-weight="500">agents, skills, memory, cron, wiki, logs, verification</text>
    <text x="212" y="358" fill="#94A3B8" font-size="20">built by dotori for solo builders who want visible, checkable automation</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="700">
    <rect x="930" y="178" width="278" height="64" rx="18" fill="#111827" stroke="#38BDF8" stroke-opacity="0.45"/>
    <circle cx="966" cy="210" r="10" fill="#38BDF8"/>
    <text x="990" y="217" fill="#E0F2FE">agent router</text>

    <rect x="1240" y="178" width="168" height="64" rx="18" fill="#111827" stroke="#22C55E" stroke-opacity="0.45"/>
    <circle cx="1276" cy="210" r="10" fill="#22C55E"/>
    <text x="1300" y="217" fill="#DCFCE7">skills</text>

    <rect x="930" y="270" width="214" height="64" rx="18" fill="#111827" stroke="#F59E0B" stroke-opacity="0.46"/>
    <circle cx="966" cy="302" r="10" fill="#F59E0B"/>
    <text x="990" y="309" fill="#FEF3C7">memory</text>

    <rect x="1176" y="270" width="232" height="64" rx="18" fill="#111827" stroke="#A78BFA" stroke-opacity="0.46"/>
    <circle cx="1212" cy="302" r="10" fill="#A78BFA"/>
    <text x="1236" y="309" fill="#EDE9FE">cron jobs</text>

    <rect x="930" y="362" width="478" height="42" rx="14" fill="#020617" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="958" y="389" fill="#94A3B8" font-size="16" font-weight="600">verify with files · diffs · tests · logs · status</text>
  </g>

  <g opacity="0.75">
    <path d="M1105 242V270" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M1324 242V270" stroke="#22C55E" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M1144 302H1176" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M1037 334V362" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M1292 334V362" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="2"/>
  </g>
</svg>
